name: Validate curriculum

on:
  push:
    paths:
      - "public/curriculum.json"
      - "public/curriculum.*.json"
      - "schema/**"
      - ".github/workflows/validate-curriculum.yml"
  pull_request:
    paths:
      - "public/curriculum.json"
      - "public/curriculum.*.json"
      - "schema/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The validator (schema/validate-curriculum.mjs) is manifest-driven: it validates
      # the manifest, then every per-competency path file it points to, plus cross-checks
      # (file present, competency field matches, task ids globally unique and prefixed).
      - run: npm install ajv@8 ajv-formats@2
      - run: node schema/validate-curriculum.mjs
