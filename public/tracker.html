<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AE Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">AE Tracker <span class="tag">SOLVD</span></div>
    <div id="user-box" class="user"></div>
  </div>

  <div id="signed-out" class="container hidden">
    <div class="signin-card">
      <h1>Welcome to the AE Tracker</h1>
      <p>Sign in with GitHub to see your personal progress through the 5 levels.</p>
      <a id="signin-link" class="signin-btn" href="">Sign in with GitHub</a>
    </div>
  </div>

  <div id="disabled" class="container hidden">
    <div class="signin-card">
      <h1>Your account is disabled</h1>
      <p>Your access to the AE Tracker has been turned off. Please contact your direct manager about it.</p>
    </div>
  </div>

  <div id="signed-in" class="container hidden">
    <div class="greeting">
      <div>
        <h1 id="greeting-title">Welcome back</h1>
        <div class="lede" id="greeting-sub"></div>
      </div>
      <div class="totals" id="totals"><strong id="done-count">0</strong> / <span id="total-count">0</span> tasks done</div>
    </div>

    <div class="competency-picker" id="competency-picker"></div>

    <div class="pill-bar-wrap" id="pill-bar-wrap"><div class="pill-bar" id="pill-bar"></div></div>
    <div class="focus-card" id="focus-card"></div>
  </div>

  <script>
    window.WORKER_URL = ["localhost", "127.0.0.1", "[::1]"].includes(window.location.hostname)
      ? "http://localhost:8787"
      : "https://ae-tracker.mihael-melnyk.workers.dev";
  </script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
