name = "ae-tracker"
main = "src/index.ts"
compatibility_date = "2026-05-27"
workers_dev = true

# Vars (non-secret) — secrets are set via `wrangler secret put`
[vars]
DATA_REPO_OWNER = "mykhailo-melnyk"
DATA_REPO_NAME = "ae-tracker-data"
FEEDBACK_REPO_OWNER = "mykhailo-melnyk"  # repo where /api/feedback opens issues (public code repo)
FEEDBACK_REPO_NAME = "ae-tracker"        # needs a `feedback` label to exist; uses the FEEDBACK_PAT secret
FEEDBACK_ASSIGNEE = "mykhailo-melnyk"    # comma-separated; auto-assigned to every feedback issue (must be repo collaborators)
ADMIN_USERNAMES = "mykhailo-melnyk,lucaskasprzyk,jackiehimel,venukanduri,arielleguizamon,dtsolvd,narendra1925,hernandp,AleksandrBSolvd,Marcelosyd,VMitskevich-Solvd,andvirga,martin-daprotis,nacholesci,suprugafad,vdomorad-solvd"  # comma-separated; e.g. "mykhailo-melnyk,jdoe"
SUPERADMIN_USERNAMES = "mykhailo-melnyk"  # comma-separated; superset of admin — can disable/enable engineers
FRONTEND_ORIGIN = "https://mykhailo-melnyk.github.io"
FRONTEND_BASE_PATH = "/ae-tracker"  # path prefix where tracker.html lives — empty for local dev (override in .dev.vars)

# KV namespace for aggregate cache
[[kv_namespaces]]
binding = "AGGREGATE_CACHE"
id = "4ffcb608e97c4f4499639f7892742d97"

# Persisted, queryable logs (Workers Logs) — dashboard → Workers → ae-tracker → Logs.
# Free tier: 200k events/day, 3-day retention; far above this app's scale.
[observability]
enabled = true
head_sampling_rate = 1  # log 100% of requests
